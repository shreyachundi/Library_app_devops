apiVersion: apps/v1
kind: Deployment
metadata:
  name: libraryapp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: libraryapp
  template:
    metadata:
      labels:
        app: libraryapp
    spec:
      containers:
        - name: libraryapp
          image: shreyachundi/library-app:new
          ports:
            - containerPort: 5001