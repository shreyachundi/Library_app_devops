<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f8; }
        h1 { color: #2c3e50; }
        .card { background: #fff; padding: 20px; border-radius: 8px;
                box-shadow: 0 2px 6px rgba(0,0,0,0.1); max-width: 600px; }
        .stats { display: flex; gap: 20px; margin: 20px 0; }
        .stat { background: #3498db; color: #fff; padding: 15px 25px;
                border-radius: 6px; text-align: center; }
        .stat.red { background: #e74c3c; }
        .stat.green { background: #27ae60; }
        a.btn { display: inline-block; margin-top: 10px; padding: 10px 18px;
                background: #2c3e50; color: #fff; text-decoration: none;
                border-radius: 5px; margin-right: 10px; }
        a.btn:hover { background: #1a252f; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📚 Library Management System</h1>
        <p>Welcome to the Library Dashboard</p>

        <div class="stats">
            <div class="stat">Total: {{ total }}</div>
            <div class="stat green">Available: {{ available }}</div>
            <div class="stat red">Issued: {{ issued }}</div>
        </div>

        <a href="/add" class="btn">➕ Add Book</a>
        <a href="/books" class="btn">📖 View Books</a>
    </div>
</body>
</html>
