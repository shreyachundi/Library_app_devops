<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add Book</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background: #f4f6f8; }
        .card { background: #fff; padding: 25px; border-radius: 8px;
                box-shadow: 0 2px 6px rgba(0,0,0,0.1); max-width: 500px; }
        h1 { color: #2c3e50; }
        label { display: block; margin-top: 15px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px;
                border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 18px; background: #27ae60;
                 color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #219150; }
        a { display: inline-block; margin-top: 15px; color: #2c3e50; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Add New Book</h1>
        <form method="POST" action="/add">
            <label>Book Title</label>
            <input type="text" name="title" placeholder="Enter book title" required>

            <label>Author</label>
            <input type="text" name="author" placeholder="Enter author name" required>

            <button type="submit">Add Book</button>
        </form>
        <a href="/">🏠 Back to Home</a>
    </div>
</body>
</html>
